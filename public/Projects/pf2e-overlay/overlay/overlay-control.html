<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PF2e Overlay Control</title>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #141117;
            color: #e8e0d6;
            padding: 18px;
            min-height: 100vh;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1f1b23;
        }
        ::-webkit-scrollbar-thumb {
            background: #5a4d5a;
            border-radius: 6px;
        }

        /* ── Typography ── */
        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            text-align: center;
            color: #d6b17a;
            letter-spacing: 2px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 small {
            font-size: 0.85rem;
            font-weight: 400;
            color: #9a8a7a;
            letter-spacing: 0;
        }

        .section {
            background: rgba(26, 22, 30, 0.85);
            border: 1px solid #3d3540;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s;
        }
        .section:hover {
            border-color: #5a4d5a;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            border-bottom: 1px solid #3d3540;
            padding-bottom: 8px;
            flex-wrap: wrap;
        }
        .section-header .title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #c9ad7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header .badge {
            background: #2f2935;
            color: #b8a898;
            font-size: 0.7rem;
            padding: 0 10px;
            border-radius: 20px;
            line-height: 20px;
            border: 1px solid #4a3f4a;
            margin-left: 4px;
        }
        .section-header .spacer {
            flex: 1;
        }

        /* ── Buttons ── */
        .btn {
            background: #2a262c;
            border: 1px solid #4f4752;
            color: #d6cdc0;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            user-select: none;
        }
        .btn:hover {
            background: #403a45;
            border-color: #6a5d6a;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: #3d2f3d;
            border-color: #6a4f5a;
            color: #f0e0d0;
        }
        .btn-primary:hover {
            background: #5a405a;
            border-color: #8a6a7a;
        }

        .btn-danger {
            border-color: #7a4040;
            color: #f0b0b0;
        }
        .btn-danger:hover {
            background: #5a3030;
            border-color: #9a5050;
        }

        .btn-success {
            border-color: #4a7a4a;
            color: #b0e0b0;
        }
        .btn-success:hover {
            background: #2a5a2a;
            border-color: #6a9a6a;
        }

        .btn-sm {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 6px;
        }
        .btn-xs {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .btn-toggled {
            background: #5e4a3a !important;
            border-color: #b8945a !important;
            color: #ffeac2 !important;
        }
        .btn-muted {
            background: #5a3a3a !important;
            border-color: #b55a5a !important;
            color: #ffbaba !important;
        }

        /* ── Button Grids ── */
        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .button-grid .btn {
            flex: 0 0 auto;
        }

        /* ── Filter Chips ── */
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .filter-chip {
            background: #1f1b23;
            border: 1px solid #3d3540;
            color: #b8a898;
            border-radius: 20px;
            padding: 3px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .filter-chip:hover {
            background: #332e38;
            border-color: #6a5d6a;
        }
        .filter-chip.active {
            background: #4a3a3a;
            border-color: #b8945a;
            color: #ffeac2;
        }
        .filter-chip .count {
            background: #2f2935;
            border-radius: 12px;
            padding: 0 8px;
            font-size: 0.65rem;
            margin-left: 4px;
            color: #9a8a7a;
        }
        .filter-chip.active .count {
            background: #5a4a3a;
            color: #d6b17a;
        }

        /* ── NPC List ── */
        .npc-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .npc-list .btn {
            font-size: 0.78rem;
            padding: 4px 12px;
        }
        .npc-list .btn.hidden {
            display: none;
        }

        /* ── Player Grid ── */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .player-card {
            background: #1f1b23;
            border: 1px solid #3d3540;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }
        .player-card:hover {
            border-color: #5a4d5a;
        }

        .player-card .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .player-card .row-label {
            font-size: 0.7rem;
            color: #9a8a7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 2px;
            font-weight: 600;
        }

        .player-card .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #5a4d5a;
            flex-shrink: 0;
        }
        .player-card .pname {
            font-weight: 600;
            font-size: 1.05rem;
            flex: 1;
            min-width: 60px;
        }
        .player-card .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .player-card .animations {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 64px;
            overflow-y: auto;
            padding: 2px 0;
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            .player-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .player-grid {
                grid-template-columns: 1fr;
            }
            .section {
                padding: 12px 14px;
            }
            h1 {
                font-size: 1.3rem;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .btn {
                font-size: 0.75rem;
                padding: 4px 10px;
            }
            .filter-chip {
                font-size: 0.7rem;
                padding: 2px 12px;
            }
            .player-card .pname {
                font-size: 0.9rem;
            }
        }

        /* ── Misc ── */
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .text-muted {
            color: #9a8a7a;
            font-size: 0.8rem;
        }
        .divider {
            width: 100%;
            height: 1px;
            background: #2f2935;
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <!-- ═══ HEADER ═══ -->
    <h1>
        ⚔️ PF2e Overlay
        <small>control panel</small>
    </h1>

    <!-- ═══ PRIMARY COMMANDS ═══ -->
    <div class="section" id="primarySection">
        <div class="section-header">
            <span class="title">🛠️ Quick Commands</span>
            <span class="badge">instant</span>
        </div>
        <div class="button-grid" id="primaryGrid"></div>
    </div>

    <!-- ═══ PLAYERS ═══ -->
    <div class="section" id="playersSection">
        <div class="section-header">
            <span class="title">👥 Characters</span>
            <span class="badge" id="playerCount">0</span>
        </div>
        <div class="player-grid" id="playerGrid"></div>
    </div>

    <!-- ═══ NPCs ═══ -->
    <div class="section" id="npcSection">
        <div class="section-header">
            <span class="title">🧛 NPCs</span>
            <span class="badge" id="npcCount">0</span>
            <span class="spacer"></span>
            <button class="btn btn-sm" id="muteNpcBtn">🔇 Mute</button>
            <button class="btn btn-sm" id="unmuteNpcBtn">🔊 Unmute</button>
            <button class="btn btn-sm btn-danger" id="clearNpcBtn">✖ Clear</button>
        </div>

        <!-- Category filters -->
        <div class="filter-group" id="npcFilterGroup"></div>

        <!-- NPC buttons -->
        <div class="npc-list" id="npcList"></div>

        <!-- NPC animations -->
        <div class="divider"></div>
        <div class="flex-wrap">
            <span class="row-label" style="font-size:0.75rem;">Animations:</span>
            <div class="flex-wrap" id="npcAnimContainer"></div>
        </div>
    </div>

    <!-- ═══ BACKGROUNDS ═══ -->
    <div class="section" id="bgSection">
        <div class="section-header">
            <span class="title">🌄 Backgrounds</span>
            <span class="badge" id="bgCount">0</span>
            <span class="spacer"></span>
            <button class="btn btn-sm btn-danger" id="clearBgBtn">✖ Clear</button>
        </div>

        <!-- Category filters (single-category only) -->
        <div class="filter-group" id="bgFilterGroup"></div>

        <!-- Background buttons -->
        <div class="button-grid" id="backgroundGrid"></div>
    </div>

    <!-- ═══ EFFECTS ═══ -->
    <div class="section" id="effectsSection">
        <div class="section-header">
            <span class="title">✨ Effects</span>
            <span class="badge" id="effectCount">0</span>
            <span class="spacer"></span>
            <button class="btn btn-sm btn-danger" id="clearEffectsBtn">✖ Clear All</button>
        </div>
        <div class="button-grid" id="effectGrid"></div>
    </div>

    <!-- ═══ EFFECT GROUPS ═══ -->
    <div class="section" id="groupsSection">
        <div class="section-header">
            <span class="title">📦 Effect Groups</span>
            <span class="badge" id="groupCount">0</span>
        </div>
        <div class="button-grid" id="groupGrid"></div>
    </div>

    <!-- ═══ SCRIPTS ═══ -->
    <script src="./shared-data.js"></script>
    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  1.  DATA
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const DATA = window.SHARED_DATA || {};
        const gmData = DATA.gmData || {};
        const playersData = DATA.playersData || [];
        const npcs = DATA.npcs || [];
        const effects = DATA.effects || [];
        const backgrounds = DATA.backgrounds || [];
        const animations = DATA.animations || [];

        // Effect groups
        const effectGroups = [];
        effects.forEach(eff => {
            if (eff.group) {
                let g = effectGroups.find(gr => gr.id === eff.group);
                if (!g) {
                    g = { id: eff.group, name: eff.group, effects: [] };
                    effectGroups.push(g);
                }
                g.effects.push(eff);
            }
        });

        // ── NPC categories ──
        const categoryMap = new Map();
        npcs.forEach(npc => {
            if (Array.isArray(npc.categories) && npc.categories.length) {
                npc.categories.forEach(cat => {
                    if (!categoryMap.has(cat)) categoryMap.set(cat, []);
                    categoryMap.get(cat).push(npc);
                });
            } else {
                const fallback = 'Uncategorized';
                if (!categoryMap.has(fallback)) categoryMap.set(fallback, []);
                categoryMap.get(fallback).push(npc);
            }
        });
        const npcCategories = Array.from(categoryMap.entries())
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([name, npcList]) => ({ name, npcs: npcList }));

        // ── Background categories (single-category) ──
        const bgCategoryMap = new Map();
        backgrounds.forEach(bg => {
            const cat = bg.category || 'Uncategorized';
            if (!bgCategoryMap.has(cat)) bgCategoryMap.set(cat, []);
            bgCategoryMap.get(cat).push(bg);
        });
        const backgroundCategories = Array.from(bgCategoryMap.entries())
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([name, bgList]) => ({ name, backgrounds: bgList }));

        // Primary commands
        const primaryCommands = [
            { label: '🟢 Chibi On', cmd: '/chibi on' },
            { label: '🔴 Chibi Off', cmd: '/chibi off' },
            { label: '🧪 Test Fill', cmd: '/chibi test' },
            { label: '🧹 Test Clear', cmd: '/chibi testoff' },
            { label: '🔇 Mute All', cmd: '/mute all' },
            { label: '🔊 Unmute All', cmd: '/unmute all' },
            { label: '⚔️ Combat', cmd: '/chibi combat' },
            { label: '🌄 Scenic', cmd: '/chibi scenic' },
        ];

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  2.  WEBSOCKET
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        let ws = null;

        function connectWebSocket() {
            const wsUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);
            //ws = new WebSocket('ws://127.0.0.1:8080');

            ws.onopen = () => console.log('🔗 Control panel connected');
            ws.onclose = () => {
                console.log('🔌 WS closed, reconnecting in 2s…');
                setTimeout(connectWebSocket, 2000);
            };
            ws.onerror = (err) => console.warn('WS error', err);
            ws.onmessage = (ev) => {
                // ignore server echoes
            };
        }

        function sendCommand(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'command', command: cmd }));
            } else {
                console.warn('⚠️ WS not connected, command not sent:', cmd);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  3.  RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        // ── Primary ──
        function renderPrimary() {
            const grid = document.getElementById('primaryGrid');
            grid.innerHTML = '';
            primaryCommands.forEach(({ label, cmd }) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = label;
                btn.addEventListener('click', () => sendCommand(cmd));
                grid.appendChild(btn);
            });
        }

        // ── Players ──
        function renderPlayers() {
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = '';
            const allPlayers = [{ name: gmData.name, chibiImg: gmData.chibiImg, id: gmData.id, alternates: gmData.alternates }, ...playersData];
            document.getElementById('playerCount').textContent = allPlayers.length;

            allPlayers.forEach(p => {
                const card = document.createElement('div');
                card.className = 'player-card';

                // ── Header row ──
                const headerRow = document.createElement('div');
                headerRow.className = 'row';
                headerRow.innerHTML = `
                            <img class="avatar" src="${p.chibiImg || ''}" alt="${p.name || 'Player'}" />
                            <span class="pname">${p.name || 'Unknown'}</span>
                        `;
                card.appendChild(headerRow);

                // ── Controls row ──
                const ctrlRow = document.createElement('div');
                ctrlRow.className = 'row';

                const muteBtn = makeBtn('🔇 Mute', 'btn btn-sm', () => sendCommand(`/mute ${p.id}`));
                const unmuteBtn = makeBtn('🔊 Unmute', 'btn btn-sm', () => sendCommand(`/unmute ${p.id}`));
                const showBtn = makeBtn('🗣️ Show', 'btn btn-sm', () => sendCommand(`/impersonate ${p.id}`));
                const popBtn = makeBtn('⏹️ Pop', 'btn btn-sm btn-danger', () => sendCommand(`/pop ${p.id}`));

                ctrlRow.append(muteBtn, unmuteBtn, showBtn, popBtn);
                card.appendChild(ctrlRow);

                // Flips (alternates)
                
                const flipRow = document.createElement('div');
                flipRow.className = 'row';
                if (!p.alternates) {
                    p.alternates = [];
                }
                let alts;
                if (p.id == "gm") {
                    alts = [{ id: 'default', name: '🔁' }, { id: 'combat', name: '⚔️' }, ...p.alternates];
                } else {
                    alts = [{ id: 'default', name: '🔁' }, { id: 'combat', name: '⚔️' }, { id: 'downed', name: '☠️' }, ...p.alternates];
                }
                alts.forEach(alt => {
                    const fb = makeBtn(`🔄 ${alt.name}`, 'btn btn-sm', () =>
                        sendCommand(`/flip ${p.id} ${alt.id}`));
                    flipRow.appendChild(fb);
                });
                
                // Companion flip
                if (p.companionFlipImg) {
                    const cf = makeBtn('🐾 Comp Flip', 'btn btn-sm', () => sendCommand(`/compflip ${p.id}`));
                    flipRow.appendChild(cf);
                }

                card.appendChild(flipRow);

                // ── Animations row ──
                const animRow = document.createElement('div');
                animRow.className = 'row';
                const animLabel = document.createElement('span');
                animLabel.className = 'row-label';
                animLabel.textContent = 'Anims:';
                animRow.appendChild(animLabel);

                const animContainer = document.createElement('span');
                animContainer.className = 'animations';
                animations.forEach(anim => {
                    const b = makeBtn(anim, 'btn btn-xs', () => sendCommand(`/animation ${anim} ${p.id}`));
                    animContainer.appendChild(b);
                });
                animRow.appendChild(animContainer);
                card.appendChild(animRow);

                // ── Combat extras (non-GM) ──
                if (p.id !== 'gm') {
                    const combatRow = document.createElement('div');
                    combatRow.className = 'row';
                    const lbl = document.createElement('span');
                    lbl.className = 'row-label';
                    lbl.textContent = 'Combat:';
                    combatRow.appendChild(lbl);
                    combatRow.appendChild(makeBtn('⚔️ Melee', 'btn btn-sm', () =>
                        sendCommand(`/animation melee ${p.id}`)));
                    combatRow.appendChild(makeBtn('🏹 Ranged', 'btn btn-sm', () =>
                        sendCommand(`/animation ranged ${p.id}`)));
                    if (Array.isArray(p.projectileImgs)) {
                        p.projectileImgs.forEach(proj => {
                            combatRow.appendChild(makeBtn(proj.name, 'btn btn-sm', () => sendCommand(`/animation ranged ${p.id} ${proj.id}`)))
                        })
                    }
                    card.appendChild(combatRow);

                    const attackedRow = document.createElement('div');
                    attackedRow.className = 'row';
                    const atkLbl = document.createElement('span');
                    atkLbl.className = 'row-label';
                    atkLbl.textContent = 'Attacked:';
                    attackedRow.appendChild(atkLbl);
                    attackedRow.appendChild(makeBtn('⚔️ Melee', 'btn btn-sm', () =>
                        sendCommand(`/animation melee npc ${p.id}`)));
                    attackedRow.appendChild(makeBtn('🏹 Ranged', 'btn btn-sm', () =>
                        sendCommand(`/animation ranged npc ${p.id}`)));
                    card.appendChild(attackedRow);
                }

                grid.appendChild(card);
            });
        }

        // ── NPCs ──
        let activeNpcCategory = 'all';

        function renderNpcs() {
            const list = document.getElementById('npcList');
            const filterGroup = document.getElementById('npcFilterGroup');
            const countEl = document.getElementById('npcCount');

            // ── Build filter chips ──
            filterGroup.innerHTML = '';
            const allChip = makeFilterChip('npc', 'all', 'All', npcs.length);
            filterGroup.appendChild(allChip);

            npcCategories.forEach(cat => {
                const chip = makeFilterChip('npc', cat.name, cat.name, cat.npcs.length);
                filterGroup.appendChild(chip);
            });

            // ── NPC buttons ──
            list.innerHTML = '';
            let visibleCount = 0;
            npcs.forEach(npc => {
                let visible = false;
                if (activeNpcCategory === 'all') {
                    visible = true;
                } else {
                    const categories = npc.categories || [];
                    visible = categories.includes(activeNpcCategory);
                }

                if (visible) visibleCount++;

                const btn = document.createElement('button');
                btn.className = `btn btn-sm ${visible ? '' : 'hidden'}`;
                btn.textContent = `${npc.name}`;
                btn.addEventListener('click', () => sendCommand(`/npc ${npc.id}`));
                list.appendChild(btn);
            });

            countEl.textContent = visibleCount;

            // ── NPC animations ──
            const animContainer = document.getElementById('npcAnimContainer');
            animContainer.innerHTML = '';
            animations.forEach(anim => {
                const b = makeBtn(anim, 'btn btn-xs', () => sendCommand(`/animation ${anim} npc`));
                animContainer.appendChild(b);
            });
        }

        // ── Backgrounds ──
        let activeBgCategory = 'all';

        function renderBackgrounds() {
            const grid = document.getElementById('backgroundGrid');
            const filterGroup = document.getElementById('bgFilterGroup');
            const countEl = document.getElementById('bgCount');

            // ── Build filter chips ──
            filterGroup.innerHTML = '';
            const allChip = makeFilterChip('bg', 'all', 'All', backgrounds.length);
            filterGroup.appendChild(allChip);

            backgroundCategories.forEach(cat => {
                const chip = makeFilterChip('bg', cat.name, cat.name, cat.backgrounds.length);
                filterGroup.appendChild(chip);
            });

            // ── Filter & render backgrounds ──
            grid.innerHTML = '';
            let visibleCount = 0;

            const filtered = backgrounds.filter(bg => {
                if (activeBgCategory === 'all') return true;
                const cat = bg.category || 'Uncategorized';
                return cat === activeBgCategory;
            });

            filtered.forEach(bg => {
                visibleCount++;
                const btn = makeBtn(`Show ${bg.name}`, 'btn', () => sendCommand(`/background ${bg.id}`));
                grid.appendChild(btn);
            });

            countEl.textContent = visibleCount;
        }

        // ── Shared filter chip factory ──
        function makeFilterChip(type, category, label, count) {
            const active = type === 'npc' ?
                activeNpcCategory === category :
                activeBgCategory === category;

            const chip = document.createElement('span');
            chip.className = `filter-chip${active ? ' active' : ''}`;
            chip.dataset.category = category;
            chip.dataset.type = type;
            chip.innerHTML = `${label} <span class="count">${count}</span>`;
            chip.addEventListener('click', () => {
                if (type === 'npc') {
                    activeNpcCategory = category;
                    renderNpcs();
                } else {
                    activeBgCategory = category;
                    renderBackgrounds();
                }
            });
            return chip;
        }

        // ── Effects ──
        function renderEffects() {
            const grid = document.getElementById('effectGrid');
            grid.innerHTML = '';
            effects.forEach(eff => {
                const btn = makeBtn(eff.name || eff.id, 'btn', () => sendCommand(`/effect ${eff.id}`));
                grid.appendChild(btn);
            });
            document.getElementById('effectCount').textContent = effects.length;
        }

        // ── Effect Groups ──
        function renderGroups() {
            const grid = document.getElementById('groupGrid');
            grid.innerHTML = '';
            effectGroups.forEach(g => {
                const btn = makeBtn(g.name, 'btn', () => sendCommand(`/effects ${g.id}`));
                grid.appendChild(btn);
            });
            document.getElementById('groupCount').textContent = effectGroups.length;
        }

        // ── Helpers ──
        function makeBtn(text, className, onClick) {
            const btn = document.createElement('button');
            btn.className = className || 'btn';
            btn.textContent = text;
            btn.addEventListener('click', onClick);
            return btn;
        }

        // ── Clear handlers ──
        document.getElementById('muteNpcBtn').addEventListener('click', () => sendCommand('/mute npc'));
        document.getElementById('unmuteNpcBtn').addEventListener('click', () => sendCommand('/unmute npc'));
        document.getElementById('clearNpcBtn').addEventListener('click', () => sendCommand('/npc clear'));
        document.getElementById('clearBgBtn').addEventListener('click', () => sendCommand('/background clear'));
        document.getElementById('clearEffectsBtn').addEventListener('click', () => sendCommand('/effects clear'));

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  4.  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        connectWebSocket();
        renderPrimary();
        renderPlayers();
        renderNpcs();
        renderBackgrounds();
        renderEffects();
        renderGroups();
    </script>
</body>
</html>

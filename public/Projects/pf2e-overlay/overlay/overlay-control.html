<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF2e Overlay Control Panel</title>
    <style>
        /* (keep your existing styles – unchanged) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background: #1a171e;
            color: #ede7d9;
            padding: 16px;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            text-align: center;
            color: #d6b17a;
            letter-spacing: 2px;
        }
        .section {
            background: rgba(30, 27, 35, 0.8);
            border: 1px solid #4a3f4a;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #c9ad7a;
            margin-bottom: 12px;
            border-bottom: 1px solid #4a3f4a;
            padding-bottom: 6px;
        }
        .testBtn {
            margin-left: auto;
            background: #3a2e3a;
            border: 1px solid #5a4d5a;
            color: #dfd6c9;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }
        .player-card {
            background: #241f26;
            border: 1px solid #3d3540;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-card .header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-card .header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #5a4d5a;
        }
        .player-card .header .name {
            font-weight: 600;
            font-size: 1.1rem;
            flex: 1;
        }
        .player-card .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .player-card .controls button {
            background: #332e36;
            border: 1px solid #4f4752;
            color: #dfd6c9;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .player-card .controls button:hover {
            background: #4d4552;
        }
        .player-card .controls button.toggled {
            background: #5e4a3a;
            border-color: #b8945a;
            color: #ffeac2;
        }
        .player-card .controls button.muted {
            background: #5a3a3a;
            border-color: #b55a5a;
            color: #ffbaba;
        }
        .player-card .animations {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 70px;
            overflow-y: auto;
            padding: 2px 0;
        }
        .player-card .animations button {
            background: #2a2630;
            border: 1px solid #3f3845;
            color: #c5b8a8;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .player-card .animations button:hover {
            background: #403a45;
        }
        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .button-grid button {
            background: #2a262c;
            border: 1px solid #4f4752;
            color: #d6cdc0;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .button-grid button:hover {
            background: #3f3840;
        }
        .button-grid button.clear {
            border-color: #b55a5a;
            color: #f0b0b0;
        }
        .button-grid button.clear:hover {
            background: #5a3a3a;
        }
        .player-card .animations::-webkit-scrollbar {
            width: 4px;
        }
        .player-card .animations::-webkit-scrollbar-track {
            background: transparent;
        }
        .player-card .animations::-webkit-scrollbar-thumb {
            background: #5a4d5a;
            border-radius: 4px;
        }
        @media (max-width: 600px) {
            .player-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>⚔️ PF2e Overlay Control</h1>

    <div class="section" id="playersSection">
        <div class="section-title">
            👥 Characters
            <button id="chibiOn" class="testBtn">🟢 Chibi On</button>
            <button id="chibiOff" class="testBtn">🔴 Chibi Off</button>
            <button id="testFillBtn" class="testBtn">🧪 Test Fill</button>
            <button id="testClearBtn" class="testBtn">🧹 Clear Test</button>
        </div>
        <div class="player-grid" id="playerGrid"></div>
    </div>

    <div class="section">
        <div class="section-title">🧛 NPCs</div>
        <div class="button-grid" id="npcGrid"></div>
    </div>

    <div class="section">
        <div class="section-title">✨ Effects</div>
        <div class="button-grid" id="effectGrid"></div>
    </div>

    <div class="section">
        <div class="section-title">📦 Effect Groups</div>
        <div class="button-grid" id="groupGrid"></div>
    </div>

    <script>
        // ==========================================================
        // 1. DATA (mirrors overlay.js)
        // ==========================================================
        const playersData = [
            { id: "uri", userId: "798680850958647307", name: "Uri", avatar: "../images/chibi/pcs/uri.png" },
            { id: "oryn", userId: "389262794480025601", name: "Oryn", avatar: "../images/chibi/pcs/oryn.png" },
            { id: "ikyki", userId: "710641511154319393", name: "Ikyki", avatar: "../images/chibi/pcs/ikyki.png" },
            { id: "azzahd", userId: "399287336937979905", name: "Azzahd", avatar: "../images/chibi/pcs/azzahd.png", compFlip: true },
            { id: "rapha", userId: "601987485513547817", name: "Rapha", avatar: "../images/chibi/pcs/rapha.png" },
            { id: "gordak", userId: "223573302176645121", name: "Gordak", avatar: "../images/chibi/pcs/gordak.png", flip: true },
            { id: "pravish", userId: "653001503023562774", name: "Pravish", avatar: "../images/chibi/pcs/pravish.png", flip: true },
            { id: "gm", userId: "670656351701303296", name: "Game Master", avatar: "../images/chibi/gm.png" },
        ];

        const npcs = [
            { id: "mira", name: "Mira" },
            { id: "elowen", name: "Elowen" },
            { id: "sortin", name: "Sortin" },
            { id: "voidsever-group", name: "Voidsever Group" },
            { id: "wolves", name: "Wolves" },
            { id: "basilisk", name: "Basilisk" },
        ];

        const effects = [
            { id: "campu", group: "camp", name: "Campfire Up" },
            { id: "campm", group: "camp", name: "Campfire Main" },
            { id: "campl", group: "camp", name: "Campfire Left" },
            { id: "campr", group: "camp", name: "Campfire Right" },
            { id: "campd", group: "camp", name: "Campfire Top" },
            { id: "campd", group: "camp", name: "Campfire Top" },
            { id: "critf", name: "Crit Fail" },
            { id: "crits", name: "Crit Success" },
            { id: "downed", name: "Downed" },
        ];

        const effectGroups = [
            { id: "camp", name: "Campfire" }
        ];

        const animations = ["shake", "bounce", "spin", "glow", "jump", "speak", "attack-left", "attack-right"];

        // ==========================================================
        // 2. WebSocket – just send commands, no state
        // ==========================================================
        let ws = null;

        function connectWebSocket() {
            const wsUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("Control panel connected to WebSocket");
            };

            ws.onclose = () => {
                console.log("WebSocket closed, reconnecting in 2s...");
                setTimeout(connectWebSocket, 2000);
            };

            // We don't need to handle incoming messages, but we can log them
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    // You could optionally log or handle server echoes, but we ignore them.
                } catch (e) {
                    console.warn("WS parse error", e);
                }
            };
        }

        // ==========================================================
        // 3. UI Rendering (no state, just buttons)
        // ==========================================================
        function renderAll() {
            renderPlayers();
            renderNPCs();
            renderEffects();
            renderGroups();
            const chibiOnBtn = document.getElementById('chibiOn');
            const chibiOffBtn = document.getElementById('chibiOff');
            const testFillBtn = document.getElementById('testFillBtn');
            const testClearBtn = document.getElementById('testClearBtn');
            chibiOnBtn.addEventListener('click', () => {
                sendCommand(`/chibi on`);
            });
            chibiOffBtn.addEventListener('click', () => {
                sendCommand(`/chibi off`);
            });
            testFillBtn.addEventListener('click', () => {
                sendCommand(`/chibi test`);
            });
            testClearBtn.addEventListener('click', () => {
                sendCommand(`/chibi testoff`);
            });
        }

        // --- Players ---
        function renderPlayers() {
            const grid = document.getElementById('playerGrid');
            grid.innerHTML = '';
            playersData.forEach(p => {
                const card = document.createElement('div');
                card.className = 'player-card';

                // Header
                const header = document.createElement('div');
                header.className = 'header';
                header.innerHTML = `
                    <img src="${p.avatar}" alt="${p.name}">
                    <span class="name">${p.name}</span>
                `;
                card.appendChild(header);

                // Controls
                const controls = document.createElement('div');
                controls.className = 'controls';

                // Mute
                if (p.id != "gm") {
                    const muteBtn = document.createElement('button');
                    muteBtn.textContent = '🔇 Mute';
                    muteBtn.addEventListener('click', () => sendCommand(`/mute ${p.id}`));
                    controls.appendChild(muteBtn);
                }

                // Flip
                if (p.flip) {
                    const flipBtn = document.createElement('button');
                    flipBtn.textContent = '↔ Flip';
                    flipBtn.addEventListener('click', () => sendCommand(`/flip ${p.id}`));
                    controls.appendChild(flipBtn);
                }

                // Companion Flip
                if (p.compFlip) {
                    const compFlipBtn = document.createElement('button');
                    compFlipBtn.textContent = '🐾 Comp Flip';
                    compFlipBtn.addEventListener('click', () => sendCommand(`/compflip ${p.id}`));
                    controls.appendChild(compFlipBtn);
                }

                // Impersonate
                const impBtn = document.createElement('button');
                impBtn.textContent = '🗣️ Speak';
                impBtn.addEventListener('click', () => sendCommand(`/impersonate ${p.id}`));
                controls.appendChild(impBtn);

                // Pop
                const popBtn = document.createElement('button');
                popBtn.textContent = '⏹️ Pop';
                popBtn.style.borderColor = '#b55a5a';
                popBtn.style.color = '#f0b0b0';
                popBtn.addEventListener('click', () => sendCommand(`/pop ${p.id}`));
                controls.appendChild(popBtn);

                card.appendChild(controls);

                // Animations
                const animContainer = document.createElement('div');
                animContainer.className = 'animations';
                animations.forEach(anim => {
                    const btn = document.createElement('button');
                    btn.textContent = anim;
                    btn.addEventListener('click', () => sendCommand(`/animation ${anim} ${p.id}`));
                    animContainer.appendChild(btn);
                });
                card.appendChild(animContainer);

                grid.appendChild(card);
            });
        }

        // --- NPCs ---
        function renderNPCs() {
            const grid = document.getElementById('npcGrid');
            grid.innerHTML = '';
            npcs.forEach(npc => {
                const btn = document.createElement('button');
                btn.textContent = `Show ${npc.name}`;
                btn.addEventListener('click', () => sendCommand(`/npc ${npc.id}`));
                grid.appendChild(btn);
            });
            const clearBtn = document.createElement('button');
            clearBtn.textContent = '✖ Clear NPC';
            clearBtn.className = 'clear';
            clearBtn.addEventListener('click', () => sendCommand('/npc clear'));
            grid.appendChild(clearBtn);
            // Animations
            const animContainer = document.createElement('div');
            animContainer.className = 'animations';
            animations.forEach(anim => {
                const btn = document.createElement('button');
                btn.textContent = `NPC ${anim}`;
                btn.addEventListener('click', () => sendCommand(`/animation ${anim} npc`));
                animContainer.appendChild(btn);
            });
            grid.appendChild(animContainer);
        }

        // --- Effects ---
        function renderEffects() {
            const grid = document.getElementById('effectGrid');
            grid.innerHTML = '';
            effects.forEach(eff => {
                const btn = document.createElement('button');
                btn.textContent = eff.name || eff.id;
                btn.addEventListener('click', () => sendCommand(`/effect ${eff.id}`));
                grid.appendChild(btn);
            });
            const clearAll = document.createElement('button');
            clearAll.textContent = '✖ Clear All Effects';
            clearAll.className = 'clear';
            clearAll.addEventListener('click', () => sendCommand('/effects clear'));
            grid.appendChild(clearAll);
        }

        // --- Groups ---
        function renderGroups() {
            const grid = document.getElementById('groupGrid');
            grid.innerHTML = '';
            effectGroups.forEach(group => {
                const btn = document.createElement('button');
                btn.textContent = `${group.name}`;
                btn.addEventListener('click', () => sendCommand(`/effects ${group.id}`));
                grid.appendChild(btn);
            });
        }

        // ==========================================================
        // 4. Send command via WebSocket
        // ==========================================================
        function sendCommand(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "command", command: cmd }));
            } else {
                console.warn("WebSocket not connected; command not sent.");
            }
        }

        // ==========================================================
        // 5. Init
        // ==========================================================
        connectWebSocket();
        renderAll();
    </script>
</body>
</html>
